name: Validate UI pull request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check and build production site
        run: npm run build
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Test migrations and React interactions
        run: npm test
      - name: Save responsive screenshots and failure context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-browser-results
          path: test-results
          retention-days: 14
