<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7fa"><title>Givvy — gifts, thoughtfully</title>
<style>
:root{--bg:#f5f7fa;--paper:#fff;--ink:#17191f;--muted:#858b97;--line:#edf0f4;--blue:#b8d5ff;--violet:#dfd4fa;--mint:#c5eddb;--pink:#ffdce3;--yellow:#ffebaf;--shadow:0 12px 35px rgba(31,42,65,.075),0 3px 9px rgba(31,42,65,.025);--r:25px;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}*{box-sizing:border-box}body{margin:0;background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8cafea;outline-offset:2px}.app{max-width:470px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;box-shadow:0 0 90px #d7dfe630}.page{padding:22px 20px 114px;min-height:100dvh}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.smallcaps{font-size:11px;font-weight:750;letter-spacing:.13em;text-transform:uppercase;color:#929aa9}.hello{font-size:31px;letter-spacing:-1.4px;line-height:1.1;margin:7px 0 0;font-weight:770}.sub{color:var(--muted);font-size:13px;line-height:1.5}.avatar{border:0;width:46px;height:46px;border-radius:18px;background:#20232b;color:white;font-size:20px;box-shadow:var(--shadow)}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:28px 0 13px;gap:10px}.sectionhead h2{font-size:19px;letter-spacing:-.55px;margin:0;font-weight:750}.linkbtn{background:none;border:0;font-size:12px;font-weight:700;color:#676f7c;padding:7px 0}.card{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:19px;margin-bottom:13px}.chipscroll{display:flex;overflow-x:auto;gap:10px;padding:4px 2px 11px;margin:0 -3px;scrollbar-width:none}.chipscroll::-webkit-scrollbar{display:none}.datechip{flex:0 0 auto;border:0;text-align:left;background:white;box-shadow:var(--shadow);padding:13px 15px;border-radius:18px;min-width:135px}.datechip .d{font-size:12px;font-weight:800;color:#5d6573}.datechi gin:5px 0 0}.arrow{margin-left:auto;font-size:20px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:470px;width:100%;padding:12px 20px max(14px,env(safe-area-inset-bottom));background:linear-gradient(0deg,#f5f7fa 75%,#f5f7faec);z-index:10}.nav{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;padding:7px;border-radius:23px;box-shadow:0 6px 26px #1c2b4c16}.nav button{border:0;background:transparent;border-radius:17px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:5px;color:#979eaa;font-size:10px;font-weight:650}.nav button.active{background:#1d2028;color:white}.nav .ni{font-size:20px;line-height:22px}.page-title{font-size:29px;line-height:1.1;letter-spacing:-1px;margin:8px 0 9px}.toolbar{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:22px 0 13px}.seg{background:#e9edf3;padding:4px;border-radius:15px;display:flex;gap:3px}.seg button{border:0;background:transparent;border-radius:12px;padding:9px 13px;font-size:12px;font-weight:750;color:#79818d}.seg button.active{background:#fff;color:#1d2028;box-shadow:0 3px 9px #28344813}.iconbtn{border:0;background:#fff;border-radius:14px;width:39px;height:39px;font-size:20px;box-shadow:var(--shadow)}.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.calhead strong{font-size:18px}.calendar{padding:19px 13px}.weekgrid,.daysgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.weekday{font-size:10px;color:#a2a8b2;font-weight:700;padding-bottom:11px}.day{position:relative;min-height:43px;padding:8px 0 9px;background:transparent;border:0;border-radius:13px;font-size:12px;font-weight:650;color:#30343d}.day.dim{color:#c0c6cf}.day.today{box-shadow:inset 0 0 0 1px #a5afbd}.day.selected{background:#1f222a;color:#fff}.dots{height:6px;display:flex;gap:3px;justify-content:center;margin-top:4px}.dot{width:5px;height:5px;border-radius:50%;background:#92b3f3}.dot.p{background:#eea text-align:center;justify-content:center;border-radius:24px;padding:20px}.suggest-emoji{font-size:68px;margin:5px 0 13px}.suggest h3{margin:0 0 9px;font-size:23px;letter-spacing:-.8px}.suggest p{font-size:13px;line-height:1.55;color:#666979}.suggestactions{display:flex;justify-content:center;gap:16px;margin:14px 0 8px}.roundaction{width:58px;height:58px;border-radius:20px;border:0;background:white;box-shadow:var(--shadow);font-size:24px}.roundaction.yes{background:#22252d;color:white}.modalbg{position:fixed;inset:0;background:#12162087;z-index:25;display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fff;border-radius:29px 29px 0 0;width:min(470px,100%);max-height:93dvh;overflow-y:auto;padding:24px 22px max(30px,env(safe-area-inset-bottom));box-shadow:0 -15px 50px #0a102030}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.sheethead h2{margin:0;font-size:22px;letter-spacing:-.6px}.close{border:0;background:#f2f4f6;border-radius:50%;width:34px;height:34px;font-size:19px}.field{margin:14px 0}.field label{display:block;font-size:11px;font-weight:760;color:#656b78;margin:0 0 8px}.field input,.field select,.field textarea{width:100%;border:1px solid #e7eaf0;border-radius:14px;padding:13px 13px;background:#fbfcfe;color:#22242b;outline-offset:1px;font-size:14px}.field textarea{resize:vertical;min-height:75px}.fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hintline{font-size:11px;color:#9299a4;line-height:1.5}.upload{display:flex;align-items:center;gap:13px;border:1px dashed #bec6d1;border-radius:16px;padding:14px;background:#f8faff}.upload img{width:64px;height:64px;object-fit:cover;border-radius:12px}.upload input{max-width:100%;font-size:11px}.checkrow{display:flex;align-items:center;gap:11px;padding:14px 0;border-bottom:1px solid var(--line);font-size:13px}.checkrow input{accent-color:#23252b;width:17px;height:17px}.checkrow span{flex:1}.notebox{border-radius:16px;background:#f5f7fb;padding:13px;font-size:12px;line-height:1.5;color:#747b89}.spacer{height:8px}.detailtop{background:linear-gradient(130deg,#e2edff,#f1e1f7);border-radius:23px;padding:22px;margin:14px 0}.detailtop h2{font-size:26px;letter-spacing:-.8px;margin:10px 0}.detailtop p{font-size:12px;color:#687186}.minirow{display:flex;justify-content:space-between;align-items:center;gap:10px}.minirow b{font-size:13px}.textbutton{border:0;background:transparent;color:#717987;font-size:12px;font-weight:700}.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#21242b;color:white;border-radius:14px;padding:11px 16px;font-size:12px;max-width:90vw;z-index:40;box-shadow:var(--shadow)}.danger{color:#c65467}.fineprint{font-size:10px;color:#a0a6b0;line-height:1.5}.back{border:0;background:none;padding:0;font-size:13px;font-weight:750;color:#727c8b}.floating{border-radius:17px;padding:10px 14px;border:0;background:#1f222a;color:white;font-size:12px;font-weight:770}a{color:inherit}.nowrap{white-space:nowrap}@media(min-width:650px){.app{margin:25px auto;border-radius:30px;overflow:hidden;min-height:850px}.bottom{bottom:0}}@media(prefers-reduced-motion:no-preference){button{transition:transform .12s ease,opacity .12s ease}button:active{transform:scale(.97)}}
</style></head><body><div id="app" class="app"></div><script>
(()=>{'use strict';
const KEY='givvy_dashboard_v1';const today=new Date();today.setHours(12,0,0,0);const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const fmtDate=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});const monthName=d=>d.toLocaleDateString('en-US',{month:'long',year:'numeric'});const currency=n=>'₽'+Math.round(Number(n)||0).toLocaleString('en-US');const uid=()=>Math.random().toString(36).slice(2,10);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const addDays=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return iso(x)};const nextNewYear=()=>today.getFullYear();
const initial=()=>({people:[{id:'p1',name:'Friend A',birthday:'',note:'Sample recipient — rename me'},{id:'p2',name:'Friend B',birthday:'',note:'Sample recipient — rename me'}],events:[{id:'ny',name:'New Year',date:`${nextNewYear()}-12-31`,kind:'holiday',people:['p1','p2'],budgets:{p1:3000,p2:1000},enabled:true},{id:'bd-demo',name:'Sample birthday',date:addDays(today,14),kind:'birthday',people:['p1'],budgets:{p1:10000},enabled:true,demo:true}],gifts:[{id:'g1',personId:'p1',eventId:'ny',name:'A thoughtful little surprise',price:1200,status:'idea',note:'Demo gift — edit or remove',image:''}],settings:{birthdayBudget:10000,christmas:false,hanukkah:false},skipped:[]});
let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial()}catch(_){data=initial()};if(!data||!Array.isArray(data.events)||!Array.isArray(data.people)||!Array.isArray(data.gifts))data=initial();data.settings=data.settings||{birthdayBudget:10000};data.skipped=data.skipped||[];
let view='home',sub=null,mode='calendar',selected=iso(today),calMonth=new Date(today.getFullYear(),today.getMonth(),1),modal=null,toastTimer=null,suggestIndex=0,filterPerson='all',storageOk=true;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));storageOk=true}catch(e){storageOk=false;notify('Browser storage is full or blocked. Export a backup in Settings.')}}
function notify(t){const old=document.querySelector('.toast');if(old)old.remove();let el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),3700)}
const person=id=>data.people.find(x=>x.id===id);const event=id=>data.events.find(x=>x.id===id);const enabledEvents=()=>data.events.filter(e=>e.enabled!==false).sort((a,b)=>a.date.localeCompare(b.date));const giftsFor=(eid,pid)=>data.gifts.filter(g=>(!eid||g.eventId===eid)&&(!pid||g.personId===pid));const total=(gs,incIdeas=false)=>gs.filter(g=>incIdeas||g.status!=='idea').reduce((n,g)=>n+(Number(g.price)||0),0);const bought=gs=>gs.filter(g=>g.status==='bought'||g.status==='given').reduce((n,g)=>n+(Number(g.price)||0),0);const eventBudget=e=>Object.values(e.budgets||{}).reduce((a,b)=>a+(Number(b)||0),0);const currentMonthEvents=()=>enabledEvents().filter(e=>e.date.slice(0,7)===iso(today).slice(0,7));const nextEvents=()=>enabledEvents().filter(e=>e.date>=iso(today));
function nav(){return `<div class="bottom"><nav class="nav">${[['home','⌂','Home'],['events','▦','Events'],['people','♙','People'],['ideas','✧','Ideas']].map(([v,i,n])=>`<button data-nav="${v}" class="${view===v?'active':''}"><span class="ni">${i}</span>${n}</button>`).join('')}</nav></div>`}
function title(name,subtitle){return `<div class="top"><div><div class="smallcaps">GIVVY / YOUR GIFT SPACE</div><h1 class="page-title">${name}</h1><div class="sub">${subtitle}</div></div><button class="avatar" data-action="settings" aria-label="Settings">⚙</button></div>`}
function home(){const upcoming=nextEvents().slice(0,5);const next=upcoming[0];const monthGifts=data.gifts.filter(g=>{const e=event(g.eventId);return e&&e.date.slice(0,7)===iso(today).slice(0,7)});const monthBudget=currentMonthEvents().reduce((n,e)=>n+eventBudget(e),0);const prepared=monthGifts.filter(g=>['bought','given'].includes(g.status)).length;return `<div class="top"><div><div class="smallcaps">THE LITTLE THINGS MATTER</div><h1 class="hello">Hello there <span style="font-size:26px">✳</span></h1><p class="sub" style="margin:10px 0 0">Make room for the thoughtful things.</p></div><button class="avatar" data-action="settings" aria-label="Settings">⚙</button></div><div class="sectionhead"><h2>Coming up</h2><button class="linkbtn" data-nav="events">View calendar →</button></div><div class="chipscroll">${upcoming.length?upcoming.map((e,i)=>`<button class="datechip ${['pink','yellow','violet'][i%3]}" data-event="${e.id}"><div class="d">${fmtDate(e.date)}</div><div class="t">${safe(e.name)}</div><div class="m">${e.people.length} ${e.people.length===1?'person':'people'} · ${giftsFor(e.id).length} ideas</div></button>`).join(''):'<div class="sub">Add your first occasion to get started.</div>'}<button class="datechip" data-action="add-event" style="min-width:100px;border:1px dashed #bec7d2;box-shadow:none;background:transparent;text-align:center;font-weight:760">＋<br><span class="m">New event</span></button></div><div class="sectionhead"><h2>Next occasion</h2><button class="linkbtn" data-nav="events">All events →</button></div>${next?`<div class="card hero"><div class="eyebrow">✦ ${fmtDate(next.date)} · ${next.kind==='birthday'?'Birthday':'Celebration'}</div><h2>${safe(next.name)}</h2><p>${next.people.length} ${next.people.length===1?'person is':'people are'} on your gift list. ${giftsFor(next.id).length} gift ${giftsFor(next.id).length===1?'idea':'ideas'} saved.</p><div class="herofoot"><span class="pill">${currency(eventBudget(next))} budget</span><button class="action" data-event="${next.id}">Open occasion ↗</button></div></div>`:`<div class="card"><p class="sub">Your next occasion will show up here.</p><button class="action" data-action="add-event">Add an occasion</button></div>`}<div class="sectionhead"><h2>This month</h2><span class="smallcaps">${today.toLocaleDateString('en-US',{month:'long'})}</span></div><div class="split"><div class="card stat blue"><div class="smallcaps">Planned budget</div><div class="value">${currency(monthBudget)}</div><div class="hint">Across ${currentMonthEvents().length} occasions</div></div><div class="card stat mint"><div class="smallcaps">Already bought</div><div class="value">${currency(bought(monthGifts))}</div><div class="hint">${prepared} of ${monthGifts.length} gift ideas</div></div></div><div class="card" style="padding:17px"><div class="minirow"><b>Gift readiness</b><span class="sub">${prepared} / ${monthGifts.length} ready</span></div><div class="bar"><div class="fill" style="width:${monthGifts.length?prepared/monthGifts.length*100:0}%"></div></div><p class="fineprint" style="margin-bottom:0">Idea prices don't count as committed spending until you mark them planned or bought.</p></div><div class="sectionhead"><h2>Need inspiration?</h2></div><button class="card idea-banner" data-nav="ideas"><div class="idea-bubble">✦</div><div><b>Find their kind of magic</b><p>A little yes-or-no gift explorer, just for fun.</p></div><span class="arrow">↗</span></button>`}
function eventsPage(){let evs=enabledEvents();let list=mode==='calendar'?evs.filter(e=>e.date===selected):evs;let first=new Date(calMonth.getFullYear(),calMonth.getMonth(),1),daysIn=new Date(first.getFullYear(),first.getMonth()+1,0).getDate(),offset=(first.getDay()+6)%7;let grid=Array.from({length:Math.ceil((offset+daysIn)/7)*7},(_,i)=>{let day=i-offset+1;let dt=new Date(first.getFullYear(),first.getMonth(),day),ds=iso(dt);let hit=evs.filter(e=>e.date===ds);return `<button class="day ${dt.getMonth()!==first.getMonth()?'dim':''} ${ds===iso(today)?'today':''} ${ds===selected?'selected':''}" data-date="${ds}">${dt.getDate()}<span class="dots">${hit.slice(0,3).map((e,k)=>`<span class="dot ${['p','v','y'][k%3]}"></span>`).join('')}</span></button>`}).join('');return `${title('Events','Every reason to celebrate, in one place.')}<div class="toolbar"><div class="seg"><button data-mode="calendar" class="${mode==='calendar'?'active':''}">Calendar</button><button data-mode="list" class="${mode==='list'?'active':''}">List</button></div><button class="floating" data-action="add-event">＋ Event</button></div>${mode==='calendar'?`<div class="card calendar"><div class="calhead"><button class="iconbtn" data-month="-1">‹</button><strong>${monthName(calMonth)}</strong><button class="iconbtn" data-month="1">›</button></div><div class="weekgrid">${['M','T','W','T','F','S','S'].map(x=>`<div class="weekday">${x}</div>`).join('')}</div><div class="daysgrid">${grid}</div></div><div class="sectionhead"><h2>${selected===iso(today)?'Today':fmtDate(selected)}</h2><span class="smallcaps">${list.length} occasions</span></div>`:`<div class="sectionhead"><h2>All occasions</h2><span class="smallcaps">${list.length} events</span></div>`}<div class="card">${list.length?list.map(e=>eventRow(e)).join(''):`<div class="empty">No occasion on this day.<br>Tap ＋ Event to plan something special.</div>`}</div><p class="fineprint">Tap a date to see its occasions. The calendar also displays birthdays and celebrations you add yourself.</p>`}
function eventRow(e){let ct=giftsFor(e.id);return `<div class="eventrow" data-event="${e.id}"><div class="datebox"><b>${e.date.slice(8)}</b><span>${new Date(e.date+'T12:00:00').toLocaleDateString('en-US',{month:'short'})}</span></div><div class="detail"><b>${safe(e.name)} ${e.demo?'<span class="tag">Demo</span>':''}</b><p>${e.people.length} recipients · ${ct.length} gifts · ${currency(eventBudget(e))} budget</p></div><span style="color:#a6abb5">›</span></div>`}
function peoplePage(){return `${title('Your people','Little details make a big difference.')}<div class="toolbar"><span class="smallcaps">${data.people.length} recipients</span><button class="floating" data-action="add-person">＋ Person</button></div><div class="card">${data.people.length?data.people.map(p=>`<div class="friend" data-person="${p.id}"><div class="face">${safe(p.name.slice(0,1).toUpperCase())}</div><div class="fbody"><b>${safe(p.name)}</b><p>${p.birthday?'Birthday · '+fmtDate(p.birthday):'Birthday not set'} · ${data.gifts.filter(g=>g.personId===p.id).length} ideas</p></div><span style="color:#a5abb6">›</span></div>`).join(''):'<div class="empty">Add people you love giving gifts to.</div>'}</div>`}
const suggestions=[['📚','A book they’d actually love','A novel, an art book or a beautiful special edition.'],['🕯️','A cosy little ritual','A candle, tea set or something for slow evenings.'],['🎟️','An experience together','A show, a workshop or a small adventure.'],['🧩','Something fun to play with','A playful desk gadget, puzzle or fidget.'],['🪴','A little green friend','A cute plant or a lovely pot for their space.'],['🎨','A creative afternoon','Something for their favorite hobby.'],['💌','Something personal','An illustrated photo, a letter or a handmade gift.']];
function ideasPage(){let [emoji,name,description]=suggestions[suggestIndex%suggestions.length];return `${title('Gift ideas','Find the one that feels just right.')}<div class="card"><div class="smallcaps">GIFT EXPLORER · ${suggestIndex%suggestions.length+1} / ${suggestions.length}</div><div class="field"><label>Finding ideas for</label><select id="suggest-person"><option value="all">Pick a person…</option>${data.people.map(p=>`<option ${filterPerson===p.id?'selected':''} value="${p.id}">${safe(p.name)}</option>`).join('')}</select></div><div id="swipe-card" class="suggest" style="touch-action:pan-y"><div class="suggest-emoji">${emoji}</div><h3>${name}</h3><p>${description}</p></div><div class="suggestactions"><button class="roundaction" data-action="skip-suggest" aria-label="Skip idea">✕</button><button class="roundaction yes" data-action="save-suggest" aria-label="Save idea">♡</button></div><p class="fineprint" style="text-align:center">Swipe left to skip or right to save. You can also use the buttons.</p></div><div class="sectionhead"><h2>Saved ideas</h2><button class="linkbtn" data-action="add-gift">＋ Add gift</button></div><div class="card">${data.gifts.length?data.gifts.map(g=>giftRow(g)).join(''):'<div class="empty">No ideas saved yet. Start exploring!</div>'}</div>`}
function giftRow(g){return `<div class="gift" data-gift="${g.id}"><div class="giftpic">${g.image?`<img src="${g.image}" alt="">`:'🎁'}</div><div class="giftinfo"><b>${safe(g.name)}</b><p>${safe(person(g.personId)?.name||'No person')} · ${safe(event(g.eventId)?.name||'No event')} · ${safe(g.status)}</p></div><span class="giftprice">${currency(g.price)}</span><span style="color:#aeb3bc">›</span></div>`}
function eventDetail(id){const e=event(id);if(!e){sub=null;return eventsPage()}const gs=giftsFor(id);return `<button class="back" data-back="events">‹ All events</button><div class="detailtop"><div class="smallcaps">${e.kind==='birthday'?'BIRTHDAY':'OCCASION'} · ${fmtDate(e.date)}</div><h2>${safe(e.name)}</h2><p>${e.people.length} recipients · ${currency(eventBudget(e))} total budget</p><button class="action ghost" data-edit-event="${id}">Edit occasion</button></div><div class="sectionhead"><h2>People & budgets</h2></div><div class="card">${e.people.length?e.people.map(pid=>`<div class="friend" data-person="${pid}"><div class="face">${safe(person(pid)?.name?.[0]||'?')}</div><div class="fbody"><b>${safe(person(pid)?.name||'Unknown')}</b><p>${giftsFor(id,pid).length} ideas · ${currency(total(giftsFor(id,pid)))} planned</p></div><span class="tag">${currency(e.budgets?.[pid])}</span></div>`).join(''):'<div class="empty">Add recipients in Edit occasion.</div>'}</div><div class="sectionhead"><h2>Gift plan</h2><button class="linkbtn" data-action="add-gift">＋ Add gift</button></div><div class="card">${gs.length?gs.map(g=>giftRow(g)).join(''):'<div class="empty">No gifts yet. Save your first idea!</div>'}</div><div class="card"><div class="minirow"><span class="sub">Planned gifts</span><b>${currency(total(gs))}</b></div><div class="spacer"></div><div class="minirow"><span class="sub">Already bought</span><b>${currency(bought(gs))}</b></div><div class="spacer"></div><div class="minirow"><span class="sub">Budget</span><b>${currency(eventBudget(e))}</b></div></div>`}
function personDetail(id){let p=person(id);if(!p){sub=null;return peoplePage()}let gs=giftsFor(null,id);let es=data.events.filter(e=>e.people.includes(id));return `<button class="back" data-back="people">‹ All people</button><div class="detailtop"><div class="smallcaps">GIFT RECIPIENT</div><h2>${safe(p.name)}</h2><p>${p.birthday?'Birthday · '+fmtDate(p.birthday):'Birthday not set'}</p><button class="action ghost" data-edit-person="${id}">Edit person</button></div><div class="sectionhead"><h2>Their occasions</h2></div><div class="card">${es.length?es.map(e=>eventRow(e)).join(''):'<div class="empty">No occasions yet.</div>'}</div><div class="sectionhead"><h2>Gift ideas</h2><button class="linkbtn" data-action="add-gift">＋ Add gift</button></div><div class="card">${gs.length?gs.map(g=>giftRow(g)).join(''):'<div class="empty">No ideas yet.</div>'}</div>`}
function settingsPage(){return `<button class="back" data-back="home">‹ Dashboard</button><h1 class="page-title" style="margin:24px 0">Settings</h1><div class="card"><div class="sectionhead" style="margin:0 0 8px"><h2>Occasions</h2></div><div class="checkrow"><span>🎄 Christmas (Dec 25)</span><input type="checkbox" data-setting="christmas" ${data.settings.christmas?'checked':''}></div><div class="checkrow"><span>🕎 Hanukkah</span><input type="checkbox" data-setting="hanukkah" ${data.settings.hanukkah?'checked':''}></div><p class="fineprint">Hanukkah dates vary each year. When enabled, add an occasion with the date you observe.</p><div class="field"><label>Default birthday budget (RUB)</label><input id="birthday-default" type="number" min="0" value="${data.settings.birthdayBudget||0}"></div><button class="action alt" data-action="save-settings">Save preferences</button></div><div class="card"><h2 style="font-size:17px">Your data</h2><p class="sub">Saved locally in this browser. Export a backup before switching browsers or devices.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="action alt" data-action="export">Export JSON</button><button class="action alt" data-action="import">Import JSON</button><input id="import-file" type="file" accept="application/json" hidden></div></div><p class="fineprint">Givvy prototype · v0.3 · English UI · Light theme. Dark-mode design tokens reserved for a later release.</p>`}
function render(){const app=document.getElementById('app');if(!app)return;app.innerHTML=`<main class="page">${sub?.type==='event'?eventDetail(sub.id):sub?.type==='person'?personDetail(sub.id):view==='home'?home():view==='events'?eventsPage():view==='people'?peoplePage():view==='ideas'?ideasPage():settingsPage()}</main>${view!=='settings'?nav():''}${modal?modalHTML():''}`; if(view==='ideas'&&!sub)wireSwipe()}
function modalHTML(){let {type,id}=modal;let p=type==='person'?(person(id)||{}):null,e=type==='event'?(event(id)||{}):null,g=type==='gift'?(data.gifts.find(g=>g.id===id)||{}):null;let heading=type==='person'?(id?'Edit person':'Add a person'):type==='event'?(id?'Edit occasion':'New occasion'):(id?'Edit gift':'Add gift');const d=type==='event'?e?.date||iso(today):'';return `<div class="modalbg" data-dismiss="1"><section class="sheet" role="dialog" aria-modal="true" aria-label="${heading}"><div class="sheethead"><h2>${heading}</h2><button class="close" data-close="1" aria-label="Close">×</button></div><form id="edit-form">${type==='person'?`<div class="field"><label>Name</label><input name="name" required maxlength="70" placeholder="Their name" value="${safe(p.name||'')}"></div><div class="field"><label>Birthday (optional)</label><input name="birthday" type="date" value="${safe(p.birthday||'')}"></div><div class="field"><label>Notes</label><textarea name="note" placeholder="What makes them smile?">${safe(p.note||'')}</textarea></div>`:type==='event'?`<div class="field"><label>Occasion name</label><input name="name" required maxlength="70" placeholder="Birthday, New Year…" value="${safe(e.name||'')}"></div><div class="fieldrow"><div class="field"><label>Date</label><input name="date" type="date" required value="${safe(d)}"></div><div class="field"><label>Type</label><select name="kind"><option value="holiday" ${e.kind!=='birthday'?'selected':''}>Celebration</option><option value="birthday" ${e.kind==='birthday'?'selected':''}>Birthday</option></select></div></div><div class="field"><label>Recipients & individual budgets (₽)</label>${data.people.length?data.people.map(p=>`<div style="display:flex;gap:10px;align-items:center;margin-bottom:10px"><input aria-label="Include ${safe(p.name)}" name="person_${p.id}" type="checkbox" ${e.people?.includes(p.id)?'checked':''} style="width:18px;flex:0 0 auto"><span style="font-size:12px;flex:1">${safe(p.name)}</span><input aria-label="Budget for ${safe(p.name)}" type="number" min="0" step="1" name="budget_${p.id}" value="${e.budgets?.[p.id]??(e.kind==='birthday'?data.settings.birthdayBudget||10000:1000)}" style="width:105px"></div>`).join(''):'<p class="sub">Add recipients first in People.</p>'}</div>`:`<div class="field"><label>Gift name</label><input name="name" required maxlength="100" value="${safe(g.name||'')}" placeholder="A lovely gift idea"></div><div class="fieldrow"><div class="field"><label>For</label><select name="personId" required>${data.people.map(p=>`<option value="${p.id}" ${g.personId===p.id||(!g.personId&&sub?.type==='person'&&sub.id===p.id)?'selected':''}>${safe(p.name)}</option>`).join('')}</select></div><div class="field"><label>Occasion</label><select name="eventId" required>${data.events.map(e=>`<option value="${e.id}" ${g.eventId===e.id||(!g.eventId&&sub?.type==='event'&&sub.id===e.id)?'selected':''}>${safe(e.name)}</option>`).join('')}</select></div></div><div class="fieldrow"><div class="field"><label>Price (₽)</label><input name="price" type="number" min="0" step="1" value="${Number(g.price)||0}"></div><div class="field"><label>Status</label><select name="status">${[['idea','Idea'],['planned','Planned'],['bought','Bought'],['given','Given']].map(([v,t])=>`<option value="${v}" ${g.status===v?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="field"><label>Link (optional)</label><input name="link" type="url" value="${safe(g.link||'')}" placeholder="https://…"></div><div class="field"><label>Photo (optional, stored in your browser)</label><div class="upload">${g.image?`<img src="${g.image}" alt="Gift preview">`:'<span style="font-size:27px">🖼️</span>'}<input name="imageFile" type="file" accept="image/*"></div></div><div class="field"><label>Notes</label><textarea name="note" placeholder="Size, color, where to buy…">${safe(g.note||'')}</textarea></div>`}<div class="spacer"></div><button type="submit" class="action full">Save ${type}</button>${id?`<button type="button" class="action alt full danger" style="margin-top:9px" data-delete="${type}" data-id="${id}">Delete ${type}</button>`:''}</form></section></div>`}
function openModal(type,id=null){if(type==='gift'&&(!data.people.length||!data.events.length)){notify('Add at least one person and occasion first.');return}modal={type,id};render()}
function go(v){view=v;sub=null;modal=null;render();window.scrollTo(0,0)}
function openEvent(id){sub={type:'event',id};view='events';render();window.scrollTo(0,0)}function openPerson(id){sub={type:'person',id};view='people';render();window.scrollTo(0,0)}
function saveForm(form){let fd=new FormData(form),type=modal.type,id=modal.id;const name=String(fd.get('name')||'').trim();if(!name){notify('Please add a name.');return}if(type==='person'){if(id){Object.assign(person(id),{name,birthday:fd.get('birthday')||'',note:fd.get('note')||''})}else data.people.push({id:uid(),name,birthday:fd.get('birthday')||'',note:fd.get('note')||''})}else if(type==='event'){let ps=data.people.filter(p=>fd.get('person_'+p.id)==='on').map(p=>p.id),budgets={};ps.forEach(pid=>budgets[pid]=Math.max(0,Number(fd.get('budget_'+pid))||0));let v={name,date:fd.get('date'),kind:fd.get('kind'),people:ps,budgets,enabled:true};if(id)Object.assign(event(id),v,{demo:false});else{v.id=uid();data.events.push(v)}}else{let v={name,personId:fd.get('personId'),eventId:fd.get('eventId'),price:Math.max(0,Number(fd.get('price'))||0),status:fd.get('status')||'idea',link:fd.get('link')||'',note:fd.get('note')||''};const file=fd.get('imageFile');const done=(img)=>{if(id){Object.assign(data.gifts.find(g=>g.id===id),v);if(img!==null)data.gifts.find(g=>g.id===id).image=img}else data.gifts.push({...v,id:uid(),image:img||''});persist();modal=null;render();notify('Gift saved ✓')};if(file&&file.size){if(file.size>6*1024*1024){notify('Choose a photo smaller than 6 MB.');return}const reader=new FileReader();reader.onerror=()=>notify('Could not read the image.');reader.onload=()=>done(reader.result);reader.readAsDataURL(file);return}done(null);return}persist();modal=null;render();notify('Saved ✓')}
function handleDelete(type,id){if(!confirm('Delete this '+type+'?'))return;if(type==='person'){data.people=data.people.filter(x=>x.id!==id);data.events.forEach(e=>{e.people=e.people.filter(p=>p!==id);delete e.budgets[id]});data.gifts=data.gifts.filter(g=>g.personId!==id)}else if(type==='event'){data.events=data.events.filter(e=>e.id!==id);data.gifts=data.gifts.filter(g=>g.eventId!==id)}else data.gifts=data.gifts.filter(g=>g.id!==id);modal=null;sub=null;persist();render();notify('Deleted')}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='givvy-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function suggestionNext(){suggestIndex++;render()}
function saveSuggestion(){if(filterPerson==='all'){notify('Choose a person first.');return}const matches=data.events.filter(e=>e.people.includes(filterPerson)).sort((a,b)=>a.date.localeCompare(b.date));if(!matches.length){notify('Add this person to an occasion first.');return}let [,name,description]=suggestions[suggestIndex%suggestions.length];data.gifts.push({id:uid(),personId:filterPerson,eventId:matches[0].id,name,price:0,status:'idea',note:description,image:''});persist();suggestIndex++;render();notify('Added to gift ideas ♡')}
function wireSwipe(){let el=document.getElementById('swipe-card');if(!el)return;let x=null;el.addEventListener('touchstart',ev=>{x=ev.touches[0].clientX},{passive:true});el.addEventListener('touchend',ev=>{if(x===null)return;let dx=ev.changedTouches[0].clientX-x;x=null;if(dx>70)saveSuggestion();else if(dx< -70)suggestionNext()},{passive:true})}
document.addEventListener('click',e=>{let t=e.target.closest('[data-nav],[data-action],[data-event],[data-person],[data-date],[data-month],[data-mode],[data-close],[data-dismiss],[data-back],[data-edit-event],[data-edit-person],[data-gift],[data-delete]');if(!t)return;if(t.dataset.dismiss&&e.target!==t)return;if(t.dataset.nav)return go(t.dataset.nav);if(t.dataset.back)return go(t.dataset.back);if(t.dataset.close||t.dataset.dismiss){modal=null;return render()}if(t.dataset.event)return openEvent(t.dataset.event);if(t.dataset.person)return openPerson(t.dataset.person);if(t.dataset.gift)return openModal('gift',t.dataset.gift);if(t.dataset.editEvent)return openModal('event',t.dataset.editEvent);if(t.dataset.editPerson)return openModal('person',t.dataset.editPerson);if(t.dataset.delete)return handleDelete(t.dataset.delete,t.dataset.id);if(t.dataset.mode){mode=t.dataset.mode;return render()}if(t.dataset.month){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+Number(t.dataset.month),1);selected=iso(calMonth);return render()}if(t.dataset.date){selected=t.dataset.date;let d=new Date(selected+'T12:00:00');calMonth=new Date(d.getFullYear(),d.getMonth(),1);return render()}if(t.dataset.action){switch(t.dataset.action){case 'settings':return go('settings');case 'add-event':return openModal('event');case 'add-person':return openModal('person');case 'add-gift':return openModal('gift');case 'skip-suggest':return suggestionNext();case 'save-suggest':return saveSuggestion();case 'save-settings':{data.settings.birthdayBudget=Math.max(0,Number(document.getElementById('birthday-default')?.value)||0);persist();return notify('Preferences saved ✓')}case 'export':return exportData();case 'import':return document.getElementById('import-file')?.click()}}});
document.addEventListener('submit',e=>{if(e.target.id!=='edit-form')return;e.preventDefault();try{saveForm(e.target)}catch(err){console.error(err);notify('Could not save: '+err.message)}});
document.addEventListener('change',e=>{let t=e.target;if(t.id==='suggest-person'){filterPerson=t.value;return}if(t.dataset.setting){data.settings[t.dataset.setting]=t.checked;persist();return}if(t.id==='import-file'&&t.files?.[0]){const r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);if(!Array.isArray(v.people)||!Array.isArray(v.events)||!Array.isArray(v.gifts))throw Error('Invalid backup');if(!confirm('Replace current data with this backup?'))return;data={...initial(),...v};persist();go('home');notify('Backup imported ✓')}catch(err){notify('Could not import backup: '+err.message)}};r.readAsText(t.files[0])}});
render();
})();
</script></body></html>
